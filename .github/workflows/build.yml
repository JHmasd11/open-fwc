name: Build OpenFWC
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test input recording and CSV serialization
        run: |
          g++ -std=c++23 -Wall -Wextra -pedantic tests/recorder_test.cpp -o /tmp/fwc-test && /tmp/fwc-test
          g++ -std=c++23 -Wall -Wextra -pedantic tests/replay_test.cpp -o /tmp/fwc-replay-test && /tmp/fwc-replay-test
          g++ -std=c++23 -Wall -Wextra -pedantic tests/checkpoint_test.cpp -o /tmp/fwc-checkpoint-test && /tmp/fwc-checkpoint-test
          g++ -std=c++23 -Wall -Wextra -pedantic tests/sweep_test.cpp -o /tmp/fwc-sweep-test && /tmp/fwc-sweep-test
          g++ -std=c++23 -Wall -Wextra -pedantic tests/fast_scan_test.cpp -o /tmp/fwc-fast-test && /tmp/fwc-fast-test
  build:
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows, os: windows-2022, target: Win64}
          - {name: Android32, os: ubuntu-latest, target: Android32}
          - {name: Android64, os: ubuntu-latest, target: Android64}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Compile with Geode SDK 6.0.0
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          combine: true
  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - name: Upload universal mod
        uses: actions/upload-artifact@v7
        with:
          name: OpenFWC-v0.4.1
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
